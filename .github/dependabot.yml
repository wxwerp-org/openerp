version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # 保留 .NET 10 产品线的更新，忽略范围从 11.0.0 的预发行版本开始。
    ignore:
      - dependency-name: "dotnet-ef"
        versions: [">= 11.0.0-0"]
      - dependency-name: "Microsoft.AspNetCore.*"
        versions: [">= 11.0.0-0"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: [">= 11.0.0-0"]
      - dependency-name: "Microsoft.Extensions.*"
        versions: [">= 11.0.0-0"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        versions: [">= 11.0.0-0"]
      - dependency-name: "Microsoft.Bcl.AsyncInterfaces"
        versions: [">= 11.0.0-0"]
      - dependency-name: "System.CodeDom"
        versions: [">= 11.0.0-0"]
      - dependency-name: "System.Composition"
        versions: [">= 11.0.0-0"]
      - dependency-name: "System.Drawing.Common"
        versions: [">= 11.0.0-0"]
      - dependency-name: "System.Threading.RateLimiting"
        versions: [">= 11.0.0-0"]

  - package-ecosystem: "npm"
    directory: "/OpenERP.Web"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@microsoft/signalr"
        versions: [">=11.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
