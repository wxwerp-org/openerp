name: Playwright E2E

on:
  workflow_dispatch:
    inputs:
      wxw:
        description: 'wxw target (live requires the wxw-e2e environment)'
        type: choice
        options: [stub, live]
        default: stub
      shop_sid:
        description: 'Live wxw test shop SID'
        default: '30'
        required: true

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}-${{ inputs.wxw || 'stub' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: Playwright (${{ inputs.wxw || 'stub' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Live credentials are only available to an explicitly dispatched environment job.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.wxw == 'live' && 'wxw-e2e' || 'e2e-stub' }}
    env:
      OPENERP_E2E_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.wxw == 'live' && 'live' || 'stub' }}
      OPENERP_TEST_SHOP_SID: ${{ inputs.shop_sid || '30' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            OpenERP.Web/pnpm-lock.yaml
      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version 13.6.5
      - name: Build app and database assertions
        run: |
          dotnet restore OpenERP.slnx --locked-mode
          dotnet build OpenERP.slnx --no-restore
          dotnet build e2e/verify-orders.cs
      - name: Run controlled live wxw pagination integration test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.wxw == 'live' }}
        env:
          OPENERP_TEST_ERP_TOKEN: ${{ secrets.WXW_ERP_TOKEN }}
        run: |
          dotnet restore tests/OpenERP.Api.LiveIntegrationTests/OpenERP.Api.LiveIntegrationTests.csproj
          dotnet test --project tests/OpenERP.Api.LiveIntegrationTests/OpenERP.Api.LiveIntegrationTests.csproj --no-restore --zero-tests-policy strict --fail-skips on --timeout 10m
      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir OpenERP.Web install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Check E2E sources
        run: |
          pnpm lint
          pnpm typecheck
      - name: Trust HTTPS development certificate
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
          dotnet dev-certs https --trust
          dotnet dev-certs https --check --trust
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"
      - name: Run Playwright
        env:
          OPENERP_TEST_ERP_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.wxw == 'live' && secrets.WXW_ERP_TOKEN || '' }}
        run: pnpm test:e2e
      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ env.OPENERP_E2E_MODE }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
