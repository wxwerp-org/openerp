name: Backend PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'OpenERP.Api/**'
      - 'OpenERP.Api.Tests/**'
      - 'OpenERP.AppHost/**'
      - 'OpenERP.Core/**'
      - 'OpenERP.Persistence/**'
      - 'OpenERP.Migrations.PostgreSQL/**'
      - 'OpenERP.Migrations.Sqlite/**'
      - 'OpenERP.ServiceDefaults/**'
      - 'OpenERP.slnx'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/packages.lock.json'
      - '**/[Nn]u[Gg]et.[Cc]onfig'
      - '.config/dotnet-tools.json'
      - '.github/nuget/**'
      - 'global.json'
      - '.editorconfig'
      - '.gitattributes'
      - '.github/workflows/ci-backend.yml'
      - '.github/workflows/actions.lock'
      # WebInstallerTests 使用 CI 安装的 Node.js 和 pnpm。
      - '.node-version'
      - 'OpenERP.Web/package.json'
      - 'OpenERP.Web/pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: OpenERP.Web/package.json
          cache: true
          cache_dependency_path: OpenERP.Web/pnpm-lock.yaml

      - name: Restore .NET dependencies
        run: dotnet restore OpenERP.slnx --locked-mode

      - name: Check resolved NuGet dependencies
        run: python3 .github/nuget/check-graph.py

      - name: Build backend
        run: dotnet build OpenERP.slnx --no-restore

      - name: Trust HTTPS development certificate
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
          dotnet dev-certs https --trust
          dotnet dev-certs https --check --trust
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"

      - name: Run all backend tests
        run: dotnet test --solution OpenERP.slnx --no-build --timeout 20m --zero-tests-policy strict --report-xunit-ctrf --report-xunit-ctrf-filename backend.json --results-directory test-results/backend

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-results-${{ github.run_attempt }}
          path: test-results/backend
          if-no-files-found: error
          retention-days: 7
