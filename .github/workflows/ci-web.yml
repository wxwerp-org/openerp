name: 前端检查

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # 合入 main 后对同一套前端检查再跑一次，作为主干门禁。
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}-${{ github.event_name }}
  # main 的推送结果不被后续提交取消；PR 与手动派发仍取消旧运行。
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: OpenERP.Web/package.json
          cache: true
          cache_dependency_path: OpenERP.Web/pnpm-lock.yaml

      - name: 安装依赖
        id: deps
        run: pnpm --dir OpenERP.Web install --frozen-lockfile

      # 任一项失败后其余检查仍执行，一轮即暴露全部问题；依赖安装失败时不继续，
      # 避免在缺少依赖时产生级联失败。
      - name: lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --dir OpenERP.Web lint

      - name: typecheck
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --dir OpenERP.Web typecheck

      - name: 单元测试
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --dir OpenERP.Web test

      - name: 生产构建
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --dir OpenERP.Web build

  web-hosting:
    name: 发布形态宿主
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 安装固定版本的 Aspire CLI
        run: |
          dotnet tool install aspire.cli --tool-path "$RUNNER_TEMP/aspire-bin" --version "$(jq -r '.tools["aspire.cli"].version' .config/dotnet-tools.json)"
          echo "$RUNNER_TEMP/aspire-bin" >> "$GITHUB_PATH"

      - name: 生成发布产物
        run: |
          aspire publish --list-steps --non-interactive
          aspire publish --non-interactive -o "$RUNNER_TEMP/aspire-output"

      # 守护发布形态的 Web 宿主：YARP 变量回潮、端口或上游丢失都会在这里失败。
      - name: 断言 Compose 宿主契约
        run: |
          docker compose -f "$RUNNER_TEMP/aspire-output/docker-compose.yaml" config --no-interpolate --format json > "$RUNNER_TEMP/compose.json"
          jq -e '
            .services.web.environment.PORT == "8000"
            and .services.web.environment.API_HTTP == "http://api:8080"
            and .services.web.environment["services__api__http__0"] == "http://api:8080"
            and (.services.web.environment | has("YARP_ENABLE_STATIC_FILES") | not)
            and ([.services.web.environment | keys[] | select(startswith("REVERSEPROXY"))] | length == 0)
            and .services.web.ports[0] == "127.0.0.1:${WEB_PORT:-8080}:8000"
            and .services.web.depends_on.api.condition == "service_started"
          ' "$RUNNER_TEMP/compose.json"

      - name: 构建 Web 镜像
        run: aspire do build-web --non-interactive

      - name: 验证宿主行为矩阵
        run: |
          set -euo pipefail
          image="$(docker images --filter=reference='web:*' --format '{{.Repository}}:{{.Tag}}' | head -1)"
          if [ -z "$image" ]; then
            echo "未找到 web 镜像。" >&2
            exit 1
          fi
          echo "Web 镜像：$image"
          cid="$(docker run -d --rm -e PORT=5000 -e API_HTTP=http://127.0.0.1:1 -p 127.0.0.1::5000 "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$cid" 5000/tcp | head -1 | awk -F: '{print $NF}')"
          base="http://127.0.0.1:$port"
          ready=""
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "$base/" 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then docker logs "$cid"; exit 1; fi

          assert_spa() {
            code="$(curl -sS -o "$RUNNER_TEMP/body" -w '%{http_code}' "$base$1")"
            if [ "$code" != 200 ] || ! grep -q '<div id="app">' "$RUNNER_TEMP/body"; then
              echo "FAIL $1 -> $code" >&2
              head -c 400 "$RUNNER_TEMP/body" >&2
              docker logs "$cid"
              exit 1
            fi
            echo "OK $1 -> 200 index"
          }
          assert_404() {
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X "${2:-GET}" "$base$1")"
            if [ "$code" != 404 ]; then
              echo "FAIL $1 ${2:-GET} -> $code" >&2
              docker logs "$cid"
              exit 1
            fi
            echo "OK $1 ${2:-GET} -> 404"
          }

          assert_spa /
          assert_spa /shops
          assert_spa /reports/orders
          assert_spa /login
          assert_spa /index.html
          assert_spa /nope
          assert_404 /assets/missing.js
          assert_404 /missing.js
          assert_404 /health
          assert_404 /shops POST

          code="$(curl -sS -o "$RUNNER_TEMP/api-body" -w '%{http_code}' "$base/api/unknown")"
          if [ "$code" = 200 ] || grep -q '<div id="app">' "$RUNNER_TEMP/api-body"; then
            echo "FAIL /api/unknown -> $code" >&2
            head -c 400 "$RUNNER_TEMP/api-body" >&2
            docker logs "$cid"
            exit 1
          fi
          echo "OK /api/unknown -> ${code}（无上游预期 502）"

  e2e:
    name: 浏览器端到端
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/e2e-results.json
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: OpenERP.Web/package.json
          cache: true
          cache_dependency_path: OpenERP.Web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm --dir OpenERP.Web install --frozen-lockfile

      - name: 安装浏览器
        run: pnpm --dir OpenERP.Web exec playwright install --with-deps chromium

      # 工作台用例不需要后端：无 OPENERP_TEST_ADMIN_PASSWORD 时由 page.route 提供 mock 会话，
      # 认证用例（authentication.spec.ts）在无密码时跳过；真实会话验收由隔离宿主
      # BrowserAcceptanceTests 显式启用入口覆盖。
      - name: 运行浏览器端到端测试
        run: pnpm --dir OpenERP.Web exec playwright test --reporter=line,json,github,html

      # 防止用例被全部跳过时仍显示成功：成功执行的用例不能为零。
      - name: 确认浏览器用例真实执行
        run: |
          node -e '
            const report = require(process.env.PLAYWRIGHT_JSON_OUTPUT_NAME)
            console.log("浏览器用例：通过 " + report.stats.expected + "，跳过 " + report.stats.skipped + "，失败 " + report.stats.unexpected)
            if (report.stats.expected === 0) {
              console.error("浏览器用例全部跳过，拒绝以假绿状态通过。")
              process.exit(1)
            }
          '

      # 失败时保留现场：HTML 报告自包含失败用例截图与 trace，下载后可本地打开。
      - name: 上传浏览器测试报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: OpenERP.Web/playwright-report
          retention-days: 7

  results:
    name: 结果汇总
    if: ${{ !cancelled() }}
    needs: [checks, e2e, web-hosting]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总检查结果
        env:
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
          WEB_HOSTING: ${{ needs.web-hosting.result }}
          EXPECTED_E2E: ${{ github.event_name == 'workflow_dispatch' && 'success' || 'skipped' }}
        run: |
          echo "前端检查=$CHECKS"
          echo "浏览器端到端=$E2E"
          echo "发布形态宿主=$WEB_HOSTING"
          if [ "$CHECKS" != "success" ] || [ "$E2E" != "$EXPECTED_E2E" ] || [ "$WEB_HOSTING" != "success" ]; then
            echo "前端检查未通过。"
            exit 1
          fi
