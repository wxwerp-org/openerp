name: 前端 PR 检查

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: OpenERP.Web/package.json
          cache: true
          cache_dependency_path: OpenERP.Web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm --dir OpenERP.Web install --frozen-lockfile

      - name: lint
        run: pnpm --dir OpenERP.Web lint

      - name: typecheck
        run: pnpm --dir OpenERP.Web typecheck

      - name: 单元测试
        run: pnpm --dir OpenERP.Web test

      - name: 生产构建
        run: pnpm --dir OpenERP.Web build

  results:
    name: 结果汇总
    if: ${{ !cancelled() }}
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总检查结果
        env:
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "前端检查=$CHECKS"
          if [ "$CHECKS" != "success" ]; then
            echo "前端 PR 检查未通过。"
            exit 1
          fi
